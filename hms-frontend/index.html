<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CareFlow HMS: Hospital Management SaaS</title>
    <meta name="description" content="Next-generation multi-tenant Hospital Management System SaaS" />
    <meta name="theme-color" content="#F5F9F8" />

    <!--
      Resolves the theme before the first paint so a dark-mode visitor never sees a
      light flash: stored choice first, otherwise the OS preference. Mirrors
      `src/lib/theme.js`, which owns every later change.
    -->
    <script>
      (function () {
        var LIGHT = '#F5F9F8';
        var DARK = '#0E1A19';
        var preference;
        try {
          preference = localStorage.getItem('careflow-theme');
        } catch (e) {}
        if (preference !== 'light' && preference !== 'dark') {
          preference = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.classList.toggle('dark', preference === 'dark');
        document.documentElement.style.colorScheme = preference;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', preference === 'dark' ? DARK : LIGHT);
      })();
    </script>

    <!--
      One family, only the weights the UI actually uses (400-800). The stylesheet is
      fetched off the critical path: `media="print"` stops it blocking first paint and the
      onload flips it to `all`. The Google CSS already declares font-display: swap, so text
      paints immediately in the fallback and swaps when the font arrives.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      />
    </noscript>
  </head>
  <body class="bg-background text-foreground antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
